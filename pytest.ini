; ---------------------------------------------------------------------------
; Configuration de pytest, l'outil qui execute les tests unitaires.
;
; Ce fichier evite d'avoir a passer des options en ligne de commande : que les
; tests soient lances a la main sur votre machine ou automatiquement par le
; pipeline GitHub Actions, ils tournent avec exactement les memes reglages.
; ---------------------------------------------------------------------------
[pytest]

; Dossier ou chercher les tests.
testpaths = tests

; Ajoute la racine du projet au chemin d'import de Python.
; Sans cette ligne, "from src.preprocessing import ..." echouerait, car pytest
; est lance depuis la racine mais n'y cherche pas les modules par defaut.
pythonpath = .

; Options appliquees a chaque execution :
;   -v                 affiche le nom de chaque test plutot qu'un simple point
;   --tb=short         trace d'erreur courte et lisible en cas d'echec
;   --strict-markers   refuse un marqueur @pytest.mark inconnu (faute de frappe)
addopts = -v --tb=short --strict-markers
